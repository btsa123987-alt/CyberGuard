services:
  cyberguard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CYBERGUARD_HISTORY: "0"
      CYBERGUARD_RATE_LIMIT: "40"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
