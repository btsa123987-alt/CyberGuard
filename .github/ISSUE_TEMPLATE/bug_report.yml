name: Bug report
about: Report a reproducible issue without submitting private URLs or secrets
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, tokens, private scanned links, or personal information."
  - type: textarea
    id: issue
    attributes:
      label: Expected vs actual behavior
      description: Provide a minimal synthetic reproduction.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [URL parser, QR decoder, API, Dashboard, Docker, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "3.12"
