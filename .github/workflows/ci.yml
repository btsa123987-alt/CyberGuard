name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: python -m pip install -r requirements.txt pytest qrcode[pil]
      - name: Check syntax
        run: python -m compileall -q app.py analyzer.py qr.py ai_assistant.py security_knowledge.py explainability.py
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Run tests
        run: python -m pytest tests -q
